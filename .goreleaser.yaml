version: 2
project_name: sshm

before:
  hooks:
  - go mod tidy
  - go test ./...

builds:
- id: sshm
  main: ./main.go
  binary: sshm
  goos:
  - linux
  - windows
  - darwin
  goarch:
  - amd64
  - arm64
  - "386"
  - arm
  goarm:
  - "6"
  - "7"
  ignore:
  # Skip ARM for Windows (not commonly used)
  - goos: windows
    goarch: arm
  - goos: windows
    goarch: arm64
  env:
  - CGO_ENABLED=0
  ldflags:
  - -s -w
  - -X github.com/Nicozilabe/sshm/cmd.AppVersion={{.Version}}
  - -X github.com/Nicozilabe/sshm/internal/drive.builtinClientID={{.Env.SSHM_GOOGLE_CLIENT_ID}}
  - -X github.com/Nicozilabe/sshm/internal/drive.builtinClientSecret={{.Env.SSHM_GOOGLE_CLIENT_SECRET}}
  flags:
  - -trimpath

archives:
- id: sshm
  formats: [ "tar.gz" ]
  # Use zip for Windows
  format_overrides:
  - goos: windows
    formats: [ "zip" ]
  # Template for archive name
  name_template: >-
    {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else if eq .Arch "386" }}i386 {{- else }}{{ .Arch }}{{ end }} {{- if .Arm }}v{{ .Arm }}{{ end }}
  files:
  - LICENSE
  - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  # Short commit hashes in the release notes
  abbrev: 7
  filters:
    exclude:
    # Commits that don't change the program, with or without a scope
    - '^(docs|test|ci|chore|build)(\(.+\))?!?:'
    # Merge commits repeat the commits they merge
    - '^Merge (pull request|branch) '
  groups:
  - title: Features
    regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
    order: 0
  - title: Bug fixes
    regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
    order: 1
  - title: Others
    order: 999

# Release configuration
release:
  github:
    owner: Nicozilabe
    name: Baqueano
  prerelease: auto
  draft: false
  replace_existing_draft: true
  target_commitish: "{{ .Commit }}"
  name_template: "{{.ProjectName}} {{.Version}}"
  header: |
    ## SSHM {{.Version}}

    Thank you for downloading SSHM!

  footer: |
    ## Installation

    ### Installation Script (Recommended)
    **Unix/Linux/macOS:**
    ```bash
    curl -sSL https://github.com/Nicozilabe/sshm/raw/main/install/unix.sh | bash
    ```

    **Windows (PowerShell):**
    ```powershell
    iwr -useb https://github.com/Nicozilabe/sshm/raw/main/install/windows.ps1 | iex
    ```

    ### Manual Installation
    Download the appropriate binary for your platform from the assets above, extract it, and place it in your PATH.

    ## Full Changelog

    See all changes at https://github.com/Nicozilabe/sshm/compare/{{.PreviousTag}}...{{.Tag}}

    ---

    📖 **Documentation:** See the updated [README](https://github.com/Nicozilabe/sshm/blob/main/README.md)

    🐛 **Issues:** Found a bug? Open an [issue](https://github.com/Nicozilabe/sshm/issues)

    ---

    Released with ❤️ by [GoReleaser](https://github.com/goreleaser/goreleaser)

# Snapshot builds (for non-tag builds)
snapshot:
  version_template: "{{ .Tag }}-snapshot-{{.ShortCommit}}"

# Metadata for package managers
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
