name: Release with GoReleaser

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history for changelog generation
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Built-in Google OAuth client baked into the binaries so users don't
          # have to create their own (create these secrets in your repo settings)
          BAQUEANO_GOOGLE_CLIENT_ID: ${{ secrets.BAQUEANO_GOOGLE_CLIENT_ID }}
          BAQUEANO_GOOGLE_CLIENT_SECRET: ${{ secrets.BAQUEANO_GOOGLE_CLIENT_SECRET }}
